<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        //initialize map
        var map = L.map('map').setView([-7.0344534, 112.7574921], 13);

        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });

        var OpenTopoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
        });

        // Menambahkan basemap ke dalam peta
        Esri_WorldImagery.addTo(map);

        // Marker
        var marker = L.marker([-7.0344534, 112.7574921]);
        var marker2 = L.marker([-6.8947651, 112.9573059]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);

        // Popup
        marker.bindPopup("<b>Bangkalan</b><br>Kabupaten Bangkalan adalah sebuah wilayah kabupaten " +
            "yang terletak di Pulau Madura, Provinsi Jawa Timur, Indonesia. " +
            "Ibu kotanya adalah Kecamatan Bangkalan. Kabupaten ini terletak di ujung paling barat Pulau Madura; " +
            "berbatasan dengan Laut Jawa di utara, Kabupaten Sampang di timur serta Selat Madura di selatan dan barat.");
        //marker.openPopup();

        marker2.bindPopup("<b>Sepulu</b><br>" +
            "Sepulu adalah sebuah kecamatan yang terletak di pesisir utara Kabupaten Bangkalan, Pulau Madura, Jawa Timur. " +
            "Daerah ini berbatasan langsung dengan Laut Jawa dan dikenal memiliki Taman Wisata Laut Labuhan, " +
            "sebuah destinasi ekowisata populer yang menawarkan keindahan hutan mangrove serta terumbu karang. " +
            "Secara historis, nama Sepulu kerap dikaitkan dengan legenda keberadaan sepuluh sumur keramat yang menjadi sumber air bagi masyarakat setempat."
        );

        // Tooltip
        marker.bindTooltip("Bangkalan");
        marker2.bindTooltip("Sepulu");

        // Circle
        var circle = L.circle([-7.0462726, 112.7853012], {
            color: "red", // warna garis
            opacity: 1, // opacity garis
            fillColor: "#f05", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 1000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Popup
        circle.bindPopup("<b>Hallo</b><br>Ini adalah popup circle radius 1 km");
        //circle.openPopup();

        // Tooltip
        circle.bindTooltip("Ini circle", { sticky: true });
        //circle.openTooltip();

        // Polyline
        var vertexPolyline = [
            [-7.0234743, 112.7511406],
            [-6.8919269, 112.9602242],
            [-6.9041940, 112.8661537],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 5, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Popup
        polyline.bindPopup("<b>Hallo</b><br>Ini adalah popup polyline");
        //polyline.openPopup();

        // Tooltip
        polyline.bindTooltip("Ini adalah tooltip polyline", { sticky: true });
        //polyline.openTooltip();

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        // Polygon
        var vertexPolygon = [
            [-6.9647711, 112.8721619],
            [-6.9814652, 112.9051208],
            [-7.0155331, 112.8714752],
            [-6.9988402, 112.8278732],
            [-6.9647711, 112.8721619]
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Popup
        polygon.bindPopup("<b>Hallo</b><br>Ini adalah popup polygon");
        polygon.openPopup();

        // Tooltip
        polygon.bindTooltip("Ini adalah tooltip polygon", { sticky: true });
        polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "OpenTopoMap": OpenTopoMap,

        };

        var overlayMaps = {
            "Bangkalan": marker,
            "Sepulu": marker2,
            "Circle": circle,
            "Line": polyline,
            "Polygon": polygon,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale
        var scale = L.control.scale({
            position: "bottomright",
        });
        scale.addTo(map);



    </script>
</body>

</html>
